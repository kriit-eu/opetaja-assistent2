name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

concurrency:
  group: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_tag.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists, skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION is new, creating release"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build:prod

      - name: Verify build output
        run: |
          for f in manifest.json content.js background.js icon48.png icon128.png; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Missing build artifact: dist/$f"
              exit 1
            fi
          done

      - name: Create release zip
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          zip -r "../opetaja-assistent2-v${VERSION}.zip" .

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: "opetaja-assistent2-v${{ needs.check.outputs.version }}.zip"
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check.outputs.version }}"
          name: "v${{ needs.check.outputs.version }}"
          generate_release_notes: true
          files: "opetaja-assistent2-v${{ needs.check.outputs.version }}.zip"

  publish:
    needs: [check, release]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check if Chrome Web Store secrets are configured
        id: secrets_check
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -n "$CHROME_EXTENSION_ID" ] && \
             [ -n "$CHROME_CLIENT_ID" ] && \
             [ -n "$CHROME_CLIENT_SECRET" ] && \
             [ -n "$CHROME_REFRESH_TOKEN" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Chrome Web Store secrets not configured, skipping publish"
          fi

      - name: Download release zip
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Upload and publish to Chrome Web Store
        if: steps.secrets_check.outputs.configured == 'true'
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: "opetaja-assistent2-v${{ needs.check.outputs.version }}.zip"
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
